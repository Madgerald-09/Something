<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, minimum-scale=0.5" />
    <title>❤️ For You</title>
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      /* Android Optimizations */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 150%; /* Allow 150% zoom */
        touch-action: manipulation;
      }
      
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Roboto', Arial, sans-serif;
        background: #000;
        height: 100vh;
        width: 100vw;
      }
      
      .click-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 24px;
        text-align: center;
        background: rgba(0, 0, 0, 0.85);
        padding: 25px 45px;
        border-radius: 15px;
        z-index: 1000;
        animation: pulse 2s infinite;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.1);
        max-width: 85%;
        min-width: 280px;
        box-sizing: border-box;
      }
      
      @keyframes pulse {
        0% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05);
        }
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      
      /* Android Media Queries */
      @media screen and (max-width: 768px) {
        .click-message {
          font-size: 20px;
          padding: 20px 35px;
          min-width: 240px;
        }
      }
      
      @media screen and (max-width: 480px) {
        .click-message {
          font-size: 18px;
          padding: 18px 30px;
          min-width: 220px;
        }
      }
      
      @media screen and (max-width: 360px) {
        .click-message {
          font-size: 16px;
          padding: 16px 25px;
          min-width: 200px;
        }
      }
      
      /* 150% zoom support */
      @media screen and (min-resolution: 150dpi) {
        .click-message {
          font-size: 22px;
        }
      }
      
      /* Safe area for notched phones */
      @supports (padding: max(0px)) {
        body {
          padding: max(0px, env(safe-area-inset-top)) 
                   max(0px, env(safe-area-inset-right)) 
                   max(0px, env(safe-area-inset-bottom)) 
                   max(0px, env(safe-area-inset-left));
        }
      }
    </style>
  </head>
  <body>
    <div class="wallpaper"></div>
    <div class="content">
      <div class="bg_heart">
        <div class="message">For My Love Favour ❤️</div>
        <a href="love.html" class="next-button">Click Me ❤️</a>
      </div>
    </div>

    <audio id="backgroundMusic" loop>
      <source src="assets/blue.mp3" type="audio/mpeg" />
      Your browser does not support audio
    </audio>

    <div class="click-message">Tap anywhere to play music ✨</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script/main.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const music = document.getElementById("backgroundMusic");
        const message = document.querySelector(".click-message");
        
        // Android detection
        const isAndroid = /android/i.test(navigator.userAgent);
        
        // Set volume for Android
        music.volume = isAndroid ? 0.8 : 0.7;
        
        // Save that music should play on next page
        music.addEventListener("play", () => {
          localStorage.setItem("musicShouldPlay", "true");
          localStorage.setItem("musicTime", music.currentTime);
          message.style.display = "none";
        });

        // Start music on first click
        document.addEventListener("click", function startMusic() {
          music.play().catch((e) => {
            console.log("Waiting for user interaction...");
            // Show retry message for Android
            if (isAndroid) {
              message.textContent = "Tap again to play music ✨";
              message.style.background = "rgba(255, 64, 129, 0.9)";
            }
          });
          document.removeEventListener("click", startMusic);
        });

        // Also support touch events for Android
        document.addEventListener("touchstart", function startMusicTouch(e) {
          music.play().catch((e) => {
            console.log("Touch interaction...");
          });
          document.removeEventListener("touchstart", startMusicTouch);
        });

        // Auto-hide message after 5 seconds
        setTimeout(() => {
          message.style.opacity = "0";
          message.style.transition = "opacity 1s ease";
          setTimeout(() => {
            message.style.display = "none";
          }, 1000);
        }, 5000);
        
        // Handle Android back button
        if (isAndroid) {
          history.pushState(null, null, location.href);
          window.onpopstate = function(event) {
            history.go(1);
          };
        }
      });
    </script>
  </body>
</html>
