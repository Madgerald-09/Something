<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, minimum-scale=0.5">
  <title>❤️ I Love You Favour</title>
  <link rel="stylesheet" href="styles/love.css">
  <style>
    /* Android Optimizations */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 150%; /* Allow 150% zoom */
      touch-action: manipulation;
    }
    
    html {
      height: -webkit-fill-available;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      position: fixed;
      font-family: 'Roboto', 'Segoe UI', -apple-system, sans-serif;
      background: #000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      height: -webkit-fill-available !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    #clickMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 64, 129, 0.95), rgba(156, 39, 176, 0.95));
      padding: 25px 45px;
      border-radius: 25px;
      z-index: 1000;
      animation: pulse 2s infinite;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(255, 64, 129, 0.5),
                  0 0 0 2px rgba(255, 255, 255, 0.1);
      display: none;
      min-width: 280px;
      max-width: 85%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      -webkit-user-select: none;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    
    @keyframes pulse {
      0% { 
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 15px 40px rgba(255, 64, 129, 0.5);
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 20px 50px rgba(255, 64, 129, 0.7);
      }
      100% { 
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 15px 40px rgba(255, 64, 129, 0.5);
      }
    }
    
    /* Android-specific Media Queries */
    @media screen and (max-width: 768px) {
      #clickMessage {
        font-size: 20px;
        padding: 22px 38px;
        min-width: 250px;
        border-radius: 22px;
      }
    }
    
    @media screen and (max-width: 480px) {
      #clickMessage {
        font-size: 18px;
        padding: 20px 35px;
        min-width: 230px;
        border-radius: 20px;
        min-height: 60px;
      }
    }
    
    @media screen and (max-width: 360px) {
      #clickMessage {
        font-size: 16px;
        padding: 18px 30px;
        min-width: 210px;
        border-radius: 18px;
        min-height: 55px;
      }
    }
    
    /* 150% zoom support */
    @media screen and (min-resolution: 150dpi) {
      #clickMessage {
        font-size: 22px;
        padding: 28px 50px;
      }
    }
    
    /* Landscape mode for Android */
    @media (orientation: landscape) and (max-height: 500px) {
      #clickMessage {
        font-size: 16px;
        padding: 15px 25px;
        min-width: 200px;
        min-height: 50px;
      }
    }
    
    /* Safe area for notched Android phones */
    @supports (padding: max(0px)) {
      body {
        padding: max(0px, env(safe-area-inset-top)) 
                 max(0px, env(safe-area-inset-right)) 
                 max(0px, env(safe-area-inset-bottom)) 
                 max(0px, env(safe-area-inset-left));
      }
      
      #clickMessage {
        margin-top: max(10px, env(safe-area-inset-top));
      }
    }
    
    /* Android performance optimizations */
    @media (prefers-reduced-motion: reduce) {
      #clickMessage {
        animation: none;
      }
    }
    
    /* Touch feedback for Android */
    #clickMessage:active {
      transform: translate(-50%, -50%) scale(0.96);
      transition: transform 0.1s;
    }
    
    /* Prevent overscroll on Android */
    body {
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>
  
  <audio id="backgroundMusic" loop preload="auto">
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <div id="clickMessage">✨ Tap to Play Music ✨</div>
  
  <script src="script/love.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const music = document.getElementById('backgroundMusic');
      const message = document.getElementById('clickMessage');
      const canvas = document.getElementById('heart');
      
      // Android detection
      const isAndroid = /android/i.test(navigator.userAgent);
      
      // Set volume for Android
      music.volume = isAndroid ? 0.85 : 0.8;
      
      // Handle Android orientation changes
      function handleResize() {
        if (canvas) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          if (typeof window.resizeHearts === 'function') {
            setTimeout(window.resizeHearts, 100);
          }
        }
      }
      
      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', function() {
        setTimeout(handleResize, 300);
      });
      
      // Check if music was playing on previous page
      const shouldPlay = localStorage.getItem('musicShouldPlay') === 'true';
      const savedTime = localStorage.getItem('musicTime') || 0;
      
      if (shouldPlay && savedTime > 0) {
        music.currentTime = parseFloat(savedTime);
      }
      
      // Android-optimized audio handling
      function setupAudio() {
        music.addEventListener('play', () => {
          localStorage.setItem('musicShouldPlay', 'true');
          message.style.display = 'none';
        });
        
        music.addEventListener('pause', () => {
          localStorage.setItem('musicShouldPlay', 'false');
        });
        
        // Save current time with Android optimization
        const saveInterval = setInterval(() => {
          if (!music.paused) {
            localStorage.setItem('musicTime', music.currentTime);
          }
        }, isAndroid ? 2000 : 3000);
        
        // Handle Android app background/foreground
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !music.paused) {
            music.pause();
          } else if (!document.hidden && shouldPlay) {
            setTimeout(() => music.play().catch(e => console.log(e)), 300);
          }
        });
        
        // Cleanup
        window.addEventListener('beforeunload', () => {
          clearInterval(saveInterval);
        });
      }
      
      // Try to auto-play with Android considerations
      setTimeout(() => {
        if (shouldPlay) {
          music.play().then(() => {
            message.style.display = 'none';
            setupAudio();
          }).catch(error => {
            console.log('Autoplay blocked');
            showPlayButton();
          });
        } else {
          showPlayButton();
        }
      }, isAndroid ? 800 : 500);
      
      function showPlayButton() {
        message.style.display = 'flex';
        message.textContent = '✨ Tap to Play Music ✨';
        
        // Touch/click handler for Android
        const playHandler = function() {
          music.play().then(() => {
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }).catch(e => {
            console.log('Play failed:', e);
            message.textContent = '❌ Tap again to play';
            setTimeout(() => {
              message.textContent = '✨ Tap to Play Music ✨';
            }, 1000);
          });
        };
        
        message.addEventListener('click', playHandler);
        message.addEventListener('touchstart', playHandler);
        
        // Also play on any tap (Android-friendly)
        document.addEventListener('click', function anyClick(e) {
          if (e.target !== message && music.paused) {
            music.play();
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }
        }, { once: true });
      }
      
      // Android double-tap to pause/play
      if (isAndroid) {
        let lastTap = 0;
        document.addEventListener('touchend', function(e) {
          const currentTime = Date.now();
          if (currentTime - lastTap < 500) {
            if (music.paused) {
              music.play();
              message.style.display = 'none';
            } else {
              music.pause();
              message.textContent = '⏸️ Tap to Resume';
              message.style.display = 'flex';
            }
          }
          lastTap = currentTime;
        });
      }
      
      // Prevent context menu on Android long press
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
      
      // Handle Android back button
      if (isAndroid) {
        history.pushState(null, null, location.href);
        window.onpopstate = function() {
          history.go(1);
        };
      }
    });
  </script>
</body>
</html>
