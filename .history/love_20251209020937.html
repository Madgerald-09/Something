<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>❤️ I Love You Favour</title>
  <link rel="stylesheet" href="styles/love.css">
  <style>
    /* Base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background: #000;
      position: fixed;
      width: 100vw;
      height: 100vh;
    }
    
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    #clickMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 64, 129, 0.95), rgba(156, 39, 176, 0.95));
      padding: 25px 45px;
      border-radius: 25px;
      z-index: 1000;
      animation: pulse 2s infinite;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(255, 64, 129, 0.5);
      display: none;
      min-width: 260px;
      max-width: 90%;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      font-weight: 500;
    }
    
    @keyframes pulse {
      0% { 
        transform: translate(-50%, -50%) scale(1);
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.05);
      }
      100% { 
        transform: translate(-50%, -50%) scale(1);
      }
    }
    
    /* 🔴 SINGLE ANDROID BREAKPOINT (most phones) */
    @media only screen and (max-width: 600px) {
      #clickMessage {
        font-size: 20px;
        padding: 20px 35px;
        min-width: 230px;
        min-height: 60px;
        border-radius: 22px;
      }
    }
    
    /* 📱 Small Mobile Phones (0px - 479px) */
    @media only screen and (max-width: 480px) {
      #clickMessage {
        font-size: 18px;
        padding: 18px 30px;
        min-width: 210px;
        min-height: 55px;
        border-radius: 20px;
        border-width: 1.5px;
      }
    }
    
    /* 📱 Very Small Mobile Phones */
    @media only screen and (max-width: 360px) {
      #clickMessage {
        font-size: 16px;
        padding: 16px 25px;
        min-width: 190px;
        min-height: 50px;
        border-radius: 18px;
      }
    }
    
    /* Landscape mode */
    @media only screen and (max-height: 500px) and (orientation: landscape) {
      #clickMessage {
        font-size: 16px;
        padding: 14px 25px;
        min-width: 200px;
        min-height: 45px;
      }
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      body {
        padding-top: max(0px, env(safe-area-inset-top));
        padding-bottom: max(0px, env(safe-area-inset-bottom));
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
    
    /* Touch feedback */
    #clickMessage:active {
      transform: translate(-50%, -50%) scale(0.95);
      transition: transform 0.1s;
    }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>
  
  <audio id="backgroundMusic" loop preload="auto">
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <div id="clickMessage">✨ Tap to Play Music ✨</div>
  
  <script src="script/love.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const music = document.getElementById('backgroundMusic');
      const message = document.getElementById('clickMessage');
      
      // Check screen size
      const isSmallPhone = window.innerWidth <= 480;
      const isAndroid = /android/i.test(navigator.userAgent);
      
      // Adjust volume
      music.volume = isSmallPhone ? 0.9 : 0.85;
      
      // Check if music was playing on previous page
      const shouldPlay = localStorage.getItem('musicShouldPlay') === 'true';
      const savedTime = localStorage.getItem('musicTime') || 0;
      
      if (shouldPlay && savedTime > 0) {
        music.currentTime = parseFloat(savedTime);
      }
      
      // Setup audio events
      function setupAudio() {
        music.addEventListener('play', () => {
          localStorage.setItem('musicShouldPlay', 'true');
          message.style.display = 'none';
        });
        
        music.addEventListener('pause', () => {
          localStorage.setItem('musicShouldPlay', 'false');
        });
        
        // Save current time
        const saveInterval = setInterval(() => {
          if (!music.paused) {
            localStorage.setItem('musicTime', music.currentTime);
          }
        }, 2000);
        
        // Handle page visibility
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            music.pause();
          }
        });
        
        window.addEventListener('beforeunload', () => {
          clearInterval(saveInterval);
        });
      }
      
      // Try to auto-play
      setTimeout(() => {
        if (shouldPlay) {
          music.play().then(() => {
            message.style.display = 'none';
            setupAudio();
          }).catch(error => {
            showPlayButton();
          });
        } else {
          showPlayButton();
        }
      }, 500);
      
      function showPlayButton() {
        message.style.display = 'flex';
        
        // Play on tap
        const playHandler = function() {
          music.play().then(() => {
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }).catch(e => {
            message.textContent = '❌ Tap again';
            setTimeout(() => {
              message.textContent = '✨ Tap to Play Music ✨';
            }, 1000);
          });
        };
        
        message.addEventListener('click', playHandler);
        
        // Also play on any tap
        document.addEventListener('click', function anyClick(e) {
          if (e.target !== message && music.paused) {
            music.play();
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }
        }, { once: true });
      }
      
      // Double-tap to pause/play on Android
      if (isAndroid) {
        let lastTap = 0;
        document.addEventListener('touchend', function(e) {
          const currentTime = Date.now();
          if (currentTime - lastTap < 500) {
            if (music.paused) {
              music.play();
              message.style.display = 'none';
            } else {
              music.pause();
              message.textContent = '⏸️ Tap to Resume';
              message.style.display = 'flex';
            }
          }
          lastTap = currentTime;
        });
      }
      
      // Prevent context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
    });
  </script>
</body>
</html>
