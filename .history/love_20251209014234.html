<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>❤️ I Love You Mitchelle</title>
  <link rel="stylesheet" href="styles/love.css">
  <style>
    /* Reset and base styles for mobile */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      touch-action: manipulation;
      background: #000;
    }
    
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    #clickMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      background: rgba(255, 64, 129, 0.95);
      padding: 20px 30px;
      border-radius: 25px;
      z-index: 1000;
      animation: pulse 2s infinite;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
      display: none;
      min-width: 280px;
      max-width: 90%;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      user-select: none;
      -webkit-user-select: none;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }
    
    @keyframes pulse {
      0% { 
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 15px 40px rgba(255, 64, 129, 0.7);
      }
      100% { 
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
      }
    }
    
    /* Mobile-specific optimizations */
    @media (max-width: 768px) {
      #clickMessage {
        font-size: 18px;
        padding: 18px 25px;
        min-width: 250px;
        border-radius: 20px;
      }
    }
    
    @media (max-width: 480px) {
      #clickMessage {
        font-size: 16px;
        padding: 16px 20px;
        min-width: 220px;
        border-radius: 18px;
        min-height: 55px;
      }
    }
    
    @media (max-width: 360px) {
      #clickMessage {
        font-size: 14px;
        padding: 14px 18px;
        min-width: 200px;
        border-radius: 15px;
        min-height: 50px;
      }
    }
    
    /* Landscape mode adjustments */
    @media (orientation: landscape) and (max-height: 500px) {
      #clickMessage {
        font-size: 14px;
        padding: 12px 20px;
        min-width: 200px;
        transform-origin: center center;
      }
    }
    
    /* High DPI screens */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      #clickMessage {
        border-width: 1px;
      }
    }
    
    /* Safe area insets for notched phones */
    @supports (padding: max(0px)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      
      #clickMessage {
        margin-top: env(safe-area-inset-top);
        margin-bottom: env(safe-area-inset-bottom);
      }
    }
    
    /* Prevent overscroll */
    body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
    
    /* Loading animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    body {
      animation: fadeIn 0.5s ease-out;
    }
    
    /* Touch feedback */
    #clickMessage:active {
      transform: translate(-50%, -50%) scale(0.98);
      transition: transform 0.1s;
    }
    
    /* Portrait orientation lock suggestion */
    @media (orientation: portrait) {
      #clickMessage::after {
        content: "🔄";
        display: inline-block;
        margin-left: 8px;
        font-size: 0.9em;
        animation: rotate 4s linear infinite;
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>
  
  <audio id="backgroundMusic" loop preload="auto">
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <div id="clickMessage">✨ Tap to Play Music ✨</div>
  
  <script src="script/love.js"></script>
  
  <script>
    // Make sure canvas script runs after DOM
    document.addEventListener('DOMContentLoaded', function() {
      const music = document.getElementById('backgroundMusic');
      const message = document.getElementById('clickMessage');
      const canvas = document.getElementById('heart');
      
      // Set mobile-friendly volume
      music.volume = 0.8;
      
      // Function to adjust canvas for mobile
      function resizeCanvas() {
        if (canvas) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          
          // Force canvas redraw if function exists
          if (typeof window.resizeHearts === 'function') {
            window.resizeHearts();
          }
        }
      }
      
      // Initial resize
      resizeCanvas();
      
      // Resize on orientation change and resize
      window.addEventListener('resize', resizeCanvas);
      window.addEventListener('orientationchange', function() {
        // Delay resize to account for orientation change
        setTimeout(resizeCanvas, 100);
      });
      
      // Check if music was playing on previous page
      const shouldPlay = localStorage.getItem('musicShouldPlay') === 'true';
      const savedTime = localStorage.getItem('musicTime') || 0;
      
      if (shouldPlay && savedTime > 0) {
        music.currentTime = parseFloat(savedTime);
      }
      
      // Mobile-optimized audio handling
      function setupAudio() {
        // Save playback state
        music.addEventListener('play', () => {
          localStorage.setItem('musicShouldPlay', 'true');
          message.style.display = 'none';
          
          // Resume animation if paused
          if (typeof window.resumeHearts === 'function') {
            window.resumeHearts();
          }
        });
        
        music.addEventListener('pause', () => {
          localStorage.setItem('musicShouldPlay', 'false');
          
          // Pause animation to save battery
          if (typeof window.pauseHearts === 'function') {
            window.pauseHearts();
          }
        });
        
        // Save current time periodically
        const saveInterval = setInterval(() => {
          if (!music.paused) {
            localStorage.setItem('musicTime', music.currentTime);
          }
        }, 1000);
        
        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
          if (document.hidden && !music.paused) {
            // Page is hidden, pause to save battery
            music.pause();
          } else if (!document.hidden && shouldPlay) {
            // Page is visible again, try to resume
            setTimeout(() => music.play(), 300);
          }
        });
        
        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
          clearInterval(saveInterval);
        });
      }
      
      // Try to auto-play with delay
      setTimeout(() => {
        if (shouldPlay) {
          // Try to resume previous playback
          const playPromise = music.play();
          
          if (playPromise !== undefined) {
            playPromise.then(() => {
              console.log('🎵 Music resumed');
              message.style.display = 'none';
              setupAudio();
            }).catch(error => {
              console.log('🔇 Autoplay blocked, showing play button');
              showPlayButton();
            });
          }
        } else {
          // Show play button for first-time users
          showPlayButton();
        }
      }, 500);
      
      function showPlayButton() {
        message.style.display = 'flex';
        message.textContent = '✨ Tap to Play Music ✨';
        
        // Play when message is tapped
        message.addEventListener('click', function playMusic() {
          music.play().then(() => {
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }).catch(e => {
            console.log('Play failed:', e);
            message.textContent = '❌ Tap again to play music';
            message.style.animation = 'none';
            setTimeout(() => {
              message.style.animation = 'pulse 2s infinite';
            }, 100);
          });
        });
        
        // Also play on any tap (for better UX)
        document.addEventListener('click', function playOnAnyClick(e) {
          if (e.target !== message && music.paused) {
            music.play();
            message.style.display = 'none';
            localStorage.setItem('musicShouldPlay', 'true');
            setupAudio();
          }
        }, { once: true });
      }
      
      // Double tap to pause/play (mobile convenience)
      let lastTap = 0;
      document.addEventListener('touchend', function(e) {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        
        if (tapLength < 500 && tapLength > 0) {
          // Double tap detected
          e.preventDefault();
          if (music.paused) {
            music.play();
            message.style.display = 'none';
          } else {
            music.pause();
            message.textContent = '⏸️ Music Paused - Tap to Resume';
            message.style.display = 'flex';
          }
        }
        lastTap = currentTime;
      });
      
      // Prevent context menu on long press
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    });
  </script>
</body>
</html>
