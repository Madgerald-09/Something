<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ I Love You Fav</title>
  <link rel="stylesheet" href="styles/love.css">
  <style>
    #clickMessage {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      text-align: center;
      background: rgba(255, 64, 129, 0.9);
      padding: 20px 40px;
      border-radius: 25px;
      z-index: 1000;
      animation: pulse 2s infinite;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 64, 129, 0.5);
      display: none;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>
  
  <audio id="backgroundMusic" loop>
    <source src="assets/blue.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  
  <div id="clickMessage">✨ Click to Play Music ✨</div>
  
  <script src="script/love.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const music = document.getElementById('backgroundMusic');
      const message = document.getElementById('clickMessage');
      
      // Check if music was playing on previous page
      const shouldPlay = localStorage.getItem('musicShouldPlay') === 'true';
      const savedTime = localStorage.getItem('musicTime') || 0;
      
      if (shouldPlay && savedTime > 0) {
        music.currentTime = parseFloat(savedTime);
      }
      
      // Try to auto-play
      setTimeout(() => {
        music.play().then(() => {
          console.log('🎵 Music playing automatically');
          message.style.display = 'none';
          
          // Save playback state
          music.addEventListener('play', () => {
            localStorage.setItem('musicShouldPlay', 'true');
          });
          
          music.addEventListener('pause', () => {
            localStorage.setItem('musicShouldPlay', 'false');
          });
          
          // Save current time every 3 seconds
          setInterval(() => {
            localStorage.setItem('musicTime', music.currentTime);
          }, 3000);
          
        }).catch(error => {
          console.log('🔇 Autoplay blocked, showing play button');
          message.style.display = 'block';
          
          // Play when message is clicked
          message.addEventListener('click', function playMusic() {
            music.play().then(() => {
              message.style.display = 'none';
              localStorage.setItem('musicShouldPlay', 'true');
            }).catch(e => {
              console.log('Still failed:', e);
              message.textContent = '❌ Cannot play audio. Please refresh.';
            });
            message.removeEventListener('click', playMusic);
          });
          
          // Also play on any click
          document.addEventListener('click', function playOnAnyClick() {
            if (music.paused) {
              music.play();
              message.style.display = 'none';
            }
            document.removeEventListener('click', playOnAnyClick);
          });
        });
      }, 1000);
    });
  </script>
</body>
</html>
