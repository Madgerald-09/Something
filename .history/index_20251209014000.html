<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>❤️ For You</title>
    <link rel="stylesheet" href="styles/main.css" />
    <style>
      /* Base styles */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Arial', 'Helvetica', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
      }
      
      /* Click message styling */
      .click-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        text-align: center;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px 30px;
        border-radius: 10px;
        z-index: 1000;
        animation: pulse 2s infinite;
        width: 80%;
        max-width: 300px;
        box-sizing: border-box;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
      }
      
      @keyframes pulse {
        0% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05);
        }
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      
      /* Content area */
      .content {
        position: relative;
        z-index: 2;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
      }
      
      .bg_heart {
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        max-width: 90%;
        width: 100%;
      }
      
      .message {
        font-size: 1.5em;
        color: white;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        word-wrap: break-word;
      }
      
      .next-button {
        display: inline-block;
        background: linear-gradient(45deg, #ff4081, #ff80ab);
        color: white;
        text-decoration: none;
        padding: 12px 30px;
        border-radius: 50px;
        font-size: 1.1em;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        min-height: 44px; /* Minimum touch target size */
        min-width: 44px;
      }
      
      .next-button:hover, .next-button:active {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6);
      }
      
      /* Media Queries for Android Devices */
      @media only screen and (max-width: 480px) {
        .click-message {
          font-size: 16px;
          padding: 12px 20px;
          width: 85%;
        }
        
        .message {
          font-size: 1.3em;
          padding: 0 10px;
        }
        
        .next-button {
          padding: 10px 25px;
          font-size: 1em;
        }
        
        .bg_heart {
          padding: 15px;
        }
      }
      
      @media only screen and (max-width: 360px) {
        .click-message {
          font-size: 14px;
          padding: 10px 15px;
        }
        
        .message {
          font-size: 1.2em;
        }
        
        .next-button {
          padding: 8px 20px;
          font-size: 0.9em;
        }
      }
      
      @media only screen and (min-width: 481px) and (max-width: 768px) {
        .click-message {
          font-size: 20px;
        }
        
        .message {
          font-size: 1.8em;
        }
        
        .next-button {
          font-size: 1.2em;
          padding: 15px 35px;
        }
      }
      
      /* Landscape orientation adjustments */
      @media only screen and (max-height: 500px) and (orientation: landscape) {
        .content {
          padding: 10px;
        }
        
        .bg_heart {
          padding: 15px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        
        .message {
          font-size: 1.2em;
          margin-bottom: 15px;
        }
        
        .next-button {
          padding: 8px 20px;
          font-size: 0.9em;
        }
        
        .click-message {
          font-size: 14px;
          padding: 8px 15px;
        }
      }
      
      /* High DPI screens */
      @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        .next-button {
          box-shadow: 0 2px 10px rgba(255, 64, 129, 0.4);
        }
        
        .message {
          text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
      }
      
      /* Prevent text selection on buttons */
      .next-button, .click-message {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      
      /* Smooth transitions */
      .next-button, .click-message, .message {
        transition: all 0.3s ease;
      }
      
      /* Wallpaper styling (fallback if main.css not loaded) */
      .wallpaper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 1;
      }
      
      /* Loading state for better UX */
      .next-button:active {
        transform: scale(0.98);
      }
      
      /* Safe area insets for notched phones */
      @supports (padding: max(0px)) {
        .content {
          padding-left: max(20px, env(safe-area-inset-left));
          padding-right: max(20px, env(safe-area-inset-right));
          padding-top: max(20px, env(safe-area-inset-top));
          padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div class="wallpaper"></div>
    <div class="content">
      <div class="bg_heart">
        <div class="message">For My Love ❤️</div>
        <a href="love.html" class="next-button">Click Me ❤️</a>
      </div>
    </div>

    <audio id="backgroundMusic" loop preload="auto">
      <source src="assets/blue.mp3" type="audio/mpeg" />
      Your browser does not support audio
    </audio>

    <div class="click-message">Tap anywhere to play music ✨</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script/main.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const music = document.getElementById("backgroundMusic");
        const message = document.querySelector(".click-message");
        const body = document.body;
        
        // Check if music is already playing from previous page
        const shouldPlay = localStorage.getItem("musicShouldPlay") === "true";
        const savedTime = localStorage.getItem("musicTime");
        
        // Optimize for mobile
        music.volume = 0.7; // Set reasonable volume for mobile
        
        // Function to start music
        function startMusic() {
          music.play().then(() => {
            localStorage.setItem("musicShouldPlay", "true");
            localStorage.setItem("musicTime", music.currentTime);
            message.style.display = "none";
          }).catch((e) => {
            console.log("Audio play failed, waiting for user interaction...");
            // Show message to tap to play
            message.textContent = "Tap to play music ✨";
            message.style.animation = "pulse 2s infinite";
          });
          
          // Remove event listeners to prevent multiple triggers
          body.removeEventListener("click", startMusic);
          body.removeEventListener("touchstart", startMusic);
        }
        
        // Try to resume music if it was playing before
        if (shouldPlay && savedTime) {
          music.currentTime = parseFloat(savedTime);
          music.play().catch(() => {
            // If autoplay fails, wait for user interaction
            console.log("Autoplay blocked, waiting for user interaction...");
          });
        }
        
        // Start music on first click or touch
        body.addEventListener("click", startMusic);
        body.addEventListener("touchstart", startMusic, { passive: true });
        
        // Save playback state periodically
        setInterval(() => {
          if (!music.paused) {
            localStorage.setItem("musicTime", music.currentTime);
          }
        }, 1000);
        
        // Auto-hide message after 5 seconds
        setTimeout(() => {
          message.style.opacity = "0";
          message.style.transition = "opacity 1s ease";
          setTimeout(() => {
            message.style.display = "none";
          }, 1000);
        }, 5000);
        
        // Handle page visibility change (when app goes to background)
        document.addEventListener("visibilitychange", function() {
          if (document.hidden) {
            // Page is hidden, pause music to save battery
            music.pause();
          } else if (shouldPlay) {
            // Page is visible again, try to resume
            music.play().catch(e => console.log("Resume failed:", e));
          }
        });
      });
    </script>
  </body>
</html>
